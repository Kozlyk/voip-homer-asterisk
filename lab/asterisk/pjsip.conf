[lab-udp]
type=transport
protocol=udp
bind=0.0.0.0:15060

[lab-endpoint](!)
type=endpoint
transport=lab-udp
context=lab
disallow=all
allow=ulaw,alaw
direct_media=no
media_address=127.0.0.1
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[6001](lab-endpoint)
auth=auth6001
aors=6001

[auth6001]
type=auth
auth_type=userpass
username=6001
password=Homer-Lab-6001

[6001]
type=aor
max_contacts=1
remove_existing=yes

[6002](lab-endpoint)
auth=auth6002
aors=6002

[auth6002]
type=auth
auth_type=userpass
username=6002
password=Homer-Lab-6002

[6002]
type=aor
max_contacts=1
remove_existing=yes
